name: fx-strategy13-apa-fx

on:
  workflow_dispatch:   # manual only - Advanced Price Action wedge-breakout on FX majors (M1 + M5)

permissions:
  contents: write

concurrency:
  group: fx-strategy13-apa-fx
  cancel-in-progress: false

jobs:
  strategy13apafx:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 7 pairs x two timeframes (M1 + M5) over extended history
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Integrity check (guards against corrupted files)
        run: python -m compileall -q src tests

      - name: Unit tests
        run: |
          python tests/test_strategy13_gold_apa.py
          python tests/test_strategy13_fx_apa.py

      - name: Run Advanced Price Action wedge-breakout on FX majors
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ENV: practice
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python -m src.backtest.strategy13_fx_apa

      - name: Commit reports
        if: always()
        run: |
          git config user.name "fx-research-bot"
          git config user.email "fx-research-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "fx strategy13 APA-fx wedge-breakout $(date -u +%Y%m%dT%H%M%SZ)"
          git pull --rebase origin main || true
          git push
